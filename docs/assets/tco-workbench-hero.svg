<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise AI Infrastructure TCO and ROI Workbench</title>
  <desc id="desc">A financial decision workspace connecting transparent assumptions to comparison, sensitivity, lineage, and executive outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d14"/><stop offset="1" stop-color="#111a24"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18232e"/><stop offset="1" stop-color="#0f161f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1600" height="680" rx="32" fill="url(#bg)"/>
  <circle cx="1420" cy="80" r="290" fill="#e8ae52" opacity=".07"/><circle cx="70" cy="650" r="250" fill="#52d6c1" opacity=".05"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="92" y="100" fill="#e8ae52" font-size="17" font-weight="700" letter-spacing="3">VALUE ENGINEERING / DECISION WORKSPACE</text>
    <text x="92" y="166" fill="#f4f6f8" font-size="52" font-weight="760">Make the economics inspectable.</text>
    <text x="92" y="210" fill="#a9b6c5" font-size="21">Current state → proposed state → transparent business case</text>
    <g transform="translate(92 280)" filter="url(#shadow)">
      <rect width="430" height="270" rx="20" fill="url(#panel)" stroke="#2c3b49"/>
      <text x="28" y="42" fill="#8292a5" font-size="13" font-weight="700" letter-spacing="2">ASSUMPTION CONTROL</text>
      <text x="28" y="82" fill="#f4f6f8" font-size="25" font-weight="700">Visible inputs &amp; provenance</text>
      <g fill="#101820" stroke="#354656"><rect x="28" y="112" width="176" height="52" rx="10"/><rect x="220" y="112" width="182" height="52" rx="10"/><rect x="28" y="180" width="374" height="58" rx="10"/></g>
      <text x="44" y="135" fill="#8393a5" font-size="11">PRODUCTIVE UTILIZATION</text><text x="44" y="154" fill="#e8ae52" font-size="17" font-weight="700">68%</text>
      <text x="236" y="135" fill="#8393a5" font-size="11">COMPUTE PRICE</text><text x="236" y="154" fill="#f4f6f8" font-size="17" font-weight="700">Illustrative / hour</text>
      <text x="44" y="204" fill="#8393a5" font-size="11">SOURCE</text><text x="44" y="226" fill="#52d6c1" font-size="14" font-weight="700">User input · explicitly editable</text>
    </g>
    <path d="M552 415H620" stroke="#e8ae52" stroke-width="2"/><path d="m620 415-12-7v14z" fill="#e8ae52"/>
    <g transform="translate(644 280)" filter="url(#shadow)">
      <rect width="860" height="270" rx="20" fill="url(#panel)" stroke="#2c3b49"/>
      <text x="28" y="42" fill="#8292a5" font-size="13" font-weight="700" letter-spacing="2">COMPARISON OUTPUT</text>
      <text x="28" y="82" fill="#f4f6f8" font-size="25" font-weight="700">Five-year TCO and decision evidence</text>
      <g transform="translate(28 112)"><rect width="238" height="126" rx="12" fill="#101820" stroke="#354656"/><text x="18" y="28" fill="#8393a5" font-size="11">CURRENT-STATE TCO</text><text x="18" y="65" fill="#f4f6f8" font-size="29" font-weight="760">100% baseline</text><path d="M18 92H210" stroke="#435364" stroke-width="8"/></g>
      <g transform="translate(282 112)"><rect width="238" height="126" rx="12" fill="#151b20" stroke="#6d5734"/><text x="18" y="28" fill="#b99d6c" font-size="11">PROPOSED-STATE TCO</text><text x="18" y="65" fill="#e8ae52" font-size="29" font-weight="760">Scenario delta</text><path d="M18 92H170" stroke="#e8ae52" stroke-width="8"/></g>
      <g transform="translate(536 112)"><rect width="296" height="126" rx="12" fill="#101820" stroke="#354656"/><text x="18" y="28" fill="#8393a5" font-size="11">DECISION CHECK</text><text x="18" y="59" fill="#52d6c1" font-size="18" font-weight="730">Payback · sensitivity · lineage</text><text x="18" y="88" fill="#a9b6c5" font-size="13">No guaranteed ROI</text></g>
    </g>
    <text x="92" y="626" fill="#708094" font-size="14">FICTIONAL SCENARIOS · DETERMINISTIC CALCULATIONS · FORMAL VALIDATION REQUIRED</text>
  </g>
</svg>
