<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">Deterministic TCO calculation engine</title>
  <desc id="desc">Current and proposed infrastructure inputs flow through annual cost formulas into TCO, unit economics, sensitivity, confidence, and calculation lineage.</desc>
  <rect width="1400" height="600" rx="28" fill="#0b1118"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="66" y="66" fill="#e8ae52" font-size="15" font-weight="700" letter-spacing="2.5">DETERMINISTIC CALCULATION BOUNDARY</text>
    <g transform="translate(66 108)">
      <rect width="300" height="390" rx="18" fill="#121c26" stroke="#334453"/>
      <text x="24" y="42" fill="#f4f6f8" font-size="21" font-weight="720">Typed assumptions</text>
      <g fill="#0e151d" stroke="#2b3a47"><rect x="24" y="72" width="252" height="54" rx="9"/><rect x="24" y="140" width="252" height="54" rx="9"/><rect x="24" y="208" width="252" height="54" rx="9"/><rect x="24" y="276" width="252" height="54" rx="9"/></g>
      <text x="40" y="94" fill="#8091a4" font-size="11">WORKLOAD &amp; GROWTH</text><text x="40" y="115" fill="#f4f6f8" font-size="14">Demand, runs, requests</text>
      <text x="40" y="162" fill="#8091a4" font-size="11">CURRENT STATE</text><text x="40" y="183" fill="#f4f6f8" font-size="14">Price × volume × operations</text>
      <text x="40" y="230" fill="#8091a4" font-size="11">PROPOSED STATE</text><text x="40" y="251" fill="#f4f6f8" font-size="14">Price × volume × operations</text>
      <text x="40" y="298" fill="#8091a4" font-size="11">PROVENANCE</text><text x="40" y="319" fill="#52d6c1" font-size="14">User / public / illustrative</text>
      <text x="24" y="365" fill="#7f8fa1" font-size="12">Strict bounds · immutable input</text>
    </g>
    <path d="M366 303h70" stroke="#e8ae52" stroke-width="2"/><path d="m436 303-12-7v14z" fill="#e8ae52"/>
    <g transform="translate(460 108)">
      <rect width="410" height="390" rx="18" fill="#171f26" stroke="#715a35"/>
      <text x="26" y="42" fill="#e8ae52" font-size="21" font-weight="720">Decimal finance engine</text>
      <text x="26" y="78" fill="#aab7c5" font-size="13">Annual cost stack</text>
      <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13"><text x="26" y="114" fill="#f4f6f8">compute = count × hours × price</text><text x="26" y="146" fill="#f4f6f8">storage = TB × monthly rate × 12</text><text x="26" y="178" fill="#f4f6f8">network = egress × GB rate × 12</text><text x="26" y="210" fill="#f4f6f8">energy = kW × PUE × hours × rate</text><text x="26" y="242" fill="#f4f6f8">staffing = FTE × loaded cost</text></g>
      <line x1="26" y1="270" x2="384" y2="270" stroke="#3a4754"/>
      <text x="26" y="305" fill="#e8ae52" font-size="14" font-weight="700">3Y / 5Y TCO · unit economics</text><text x="26" y="333" fill="#e8ae52" font-size="14" font-weight="700">net value · ROI · payback</text><text x="26" y="365" fill="#8292a4" font-size="12">Explicit rounding · unavailable states</text>
    </g>
    <path d="M870 303h70" stroke="#e8ae52" stroke-width="2"/><path d="m940 303-12-7v14z" fill="#e8ae52"/>
    <g transform="translate(964 108)">
      <rect width="370" height="390" rx="18" fill="#121c26" stroke="#334453"/>
      <text x="24" y="42" fill="#f4f6f8" font-size="21" font-weight="720">Inspectable outputs</text>
      <g><rect x="24" y="72" width="322" height="68" rx="10" fill="#0e151d"/><text x="42" y="96" fill="#8091a4" font-size="11">SCENARIO COMPARISON</text><text x="42" y="123" fill="#e8ae52" font-size="18" font-weight="700">Current ↔ proposed</text><rect x="24" y="154" width="322" height="68" rx="10" fill="#0e151d"/><text x="42" y="178" fill="#8091a4" font-size="11">SENSITIVITY</text><text x="42" y="205" fill="#f4f6f8" font-size="16" font-weight="700">Utilization · price · growth · energy</text><rect x="24" y="236" width="322" height="68" rx="10" fill="#0e151d"/><text x="42" y="260" fill="#8091a4" font-size="11">CALCULATION LINEAGE</text><text x="42" y="287" fill="#52d6c1" font-size="16" font-weight="700">Formula + inputs + source</text><rect x="24" y="318" width="322" height="46" rx="10" fill="#171b1d" stroke="#655333"/><text x="42" y="347" fill="#d8bd8a" font-size="13">No guaranteed ROI</text></g>
    </g>
    <text x="66" y="552" fill="#758698" font-size="13">No LLM or external service participates in calculation, rounding, sensitivity, or confidence.</text>
  </g>
</svg>
