<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 400" width="1060" height="400" role="img" aria-label="Architecture: browser workspace to FastAPI boundary, then the deterministic Decimal calculation engine, with formula lineage, SQLite scenario versions, and JSON, CSV, and PDF exports">
  <title>Architecture: browser workspace to FastAPI boundary, then the deterministic Decimal calculation engine, with formula lineage, SQLite scenario versions, and JSON, CSV, and PDF exports</title>
  <style>
  text { font-family: 'Helvetica Neue',Helvetica,Arial,sans-serif; }
  .node   { fill: none; stroke: #16181d; stroke-width: 1.25; }
  .accent { fill: #f2f2f3; stroke: #16181d; stroke-width: 1.25; }
  .store  { fill: none; stroke: #16181d; stroke-width: 1.25; stroke-dasharray: 3 3; }
  .title  { font-size: 15px; font-weight: 600; fill: #16181d; }
  .sub    { font-size: 12px; fill: #5b6270; }
  .kick   { font-size: 10px; font-weight: 600; letter-spacing: .14em; fill: #5b6270; }
  .note   { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size: 11px; fill: #5b6270; }
  .edge   { fill: none; stroke: #16181d; stroke-width: 1.25; }
  .edge-o { fill: none; stroke: #5b6270; stroke-width: 1.25; stroke-dasharray: 4 4; }
  .rule   { stroke: #16181d; stroke-width: 1; opacity: .18; }
  .head   { fill: #16181d; }
  .head-o { fill: #5b6270; }
  @media (prefers-color-scheme: dark) {
    .node, .store { stroke: #e6e8eb; }
    .accent { fill: #1b2027; stroke: #e6e8eb; }
    .title { fill: #e6e8eb; }
    .sub, .kick, .note { fill: #a3abb6; }
    .edge { stroke: #e6e8eb; }
    .edge-o { stroke: #a3abb6; }
    .rule { stroke: #e6e8eb; }
    .head { fill: #e6e8eb; }
    .head-o { fill: #a3abb6; }
  }
</style>
