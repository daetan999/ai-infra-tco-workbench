<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" width="1240" height="400" role="img" aria-label="Five-step business-case workflow: set demand, model both infrastructure states, trace the economics, stress the case, and frame the decision">
  <title>Five-step business-case workflow: set demand, model both infrastructure states, trace the economics, stress the case, and frame the decision</title>
  <desc>Five stages establish shared demand, model comparable infrastructure states, trace calculation lineage, test sensitivity, and prepare a conditional investment decision.</desc>
  <style>
  text { font-family: 'Helvetica Neue',Helvetica,Arial,sans-serif; }
  .node   { fill: none; stroke: #16181d; stroke-width: 1.25; }
  .accent { fill: #f2f2f3; stroke: #16181d; stroke-width: 1.25; }
  .store  { fill: none; stroke: #16181d; stroke-width: 1.25; stroke-dasharray: 3 3; }
  .title  { font-size: 15px; font-weight: 600; fill: #16181d; }
  .sub    { font-size: 12px; fill: #5b6270; }
  .kick   { font-size: 10px; font-weight: 600; letter-spacing: .14em; fill: #5b6270; }
  .note   { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size: 11px; fill: #5b6270; }
  .edge   { fill: none; stroke: #16181d; stroke-width: 1.25; }
  .edge-o { fill: none; stroke: #5b6270; stroke-width: 1.25; stroke-dasharray: 4 4; }
  .rule   { stroke: #16181d; stroke-width: 1; opacity: .18; }
  .head   { fill: #16181d; }
  .head-o { fill: #5b6270; }
  @media (prefers-color-scheme: dark) {
    .node, .store { stroke: #e6e8eb; }
    .accent { fill: #1b2027; stroke: #e6e8eb; }
    .title { fill: #e6e8eb; }
    .sub, .kick, .note { fill: #a3abb6; }
    .edge { stroke: #e6e8eb; }
    .edge-o { stroke: #a3abb6; }
    .rule { stroke: #e6e8eb; }
    .head { fill: #e6e8eb; }
    .head-o { fill: #a3abb6; }
  }
</style>
  <text class="kick" x="40" y="38">TRANSPARENT BUSINESS-CASE WORKFLOW</text>
  <text class="title" x="40" y="62">Evidence before recommendation</text>
  <line class="rule" x1="40" y1="82" x2="1200" y2="82"/>
  <rect class="node" x="40" y="110" width="212" height="205" rx="2"/>
  <text class="note" x="56" y="138" letter-spacing="1.5">01</text>
  <text class="title" x="56" y="166">Set demand</text>
  <text class="sub" x="56" y="191">Model scale, runs,</text>
  <text class="sub" x="56" y="208">requests, peak &amp; growth</text>
  <line class="rule" x1="56" y1="269" x2="236" y2="269"/>
  <text class="kick" x="56" y="288">WORKLOAD</text>
  <text class="sub" x="56" y="304">Bounded inputs</text>
  <rect class="node" x="277" y="110" width="212" height="205" rx="2"/>
  <text class="note" x="293" y="138" letter-spacing="1.5">02</text>
  <text class="title" x="293" y="166">Model both sides</text>
  <text class="sub" x="293" y="191">Compute, storage, network,</text>
  <text class="sub" x="293" y="208">energy and operations</text>
  <line class="rule" x1="293" y1="269" x2="473" y2="269"/>
  <text class="kick" x="293" y="288">STATES</text>
  <text class="sub" x="293" y="304">Current ↔ proposed</text>
  <polygon class="head" points="256,207.5 265,212.5 256,217.5"/>
  <rect class="node" x="514" y="110" width="212" height="205" rx="2"/>
  <text class="note" x="530" y="138" letter-spacing="1.5">03</text>
  <text class="title" x="530" y="166">Trace the economics</text>
  <text class="sub" x="530" y="191">TCO, unit economics,</text>
  <text class="sub" x="530" y="208">payback and net value</text>
  <line class="rule" x1="530" y1="269" x2="710" y2="269"/>
  <text class="kick" x="530" y="288">CALCULATE</text>
  <text class="sub" x="530" y="304">Decimal engine</text>
  <polygon class="head" points="493,207.5 502,212.5 493,217.5"/>
  <rect class="node" x="751" y="110" width="212" height="205" rx="2"/>
  <text class="note" x="767" y="138" letter-spacing="1.5">04</text>
  <text class="title" x="767" y="166">Stress the case</text>
  <text class="sub" x="767" y="191">Utilization, price, growth</text>
  <text class="sub" x="767" y="208">and energy sensitivity</text>
  <line class="rule" x1="767" y1="269" x2="947" y2="269"/>
  <text class="kick" x="767" y="288">CHALLENGE</text>
  <text class="sub" x="767" y="304">Visible ranges</text>
  <polygon class="head" points="730,207.5 739,212.5 730,217.5"/>
  <rect class="node" x="988" y="110" width="212" height="205" rx="2"/>
  <text class="note" x="1004" y="138" letter-spacing="1.5">05</text>
  <text class="title" x="1004" y="166">Frame the decision</text>
  <text class="sub" x="1004" y="191">Confidence, lineage, CSV</text>
  <text class="sub" x="1004" y="208">and executive PDF</text>
  <line class="rule" x1="1004" y1="269" x2="1184" y2="269"/>
  <text class="kick" x="1004" y="288">COMMUNICATE</text>
  <text class="sub" x="1004" y="304">Advance or reshape</text>
  <polygon class="head" points="967,207.5 976,212.5 967,217.5"/>
  <text class="note" x="40" y="362" text-anchor="start">Sanitized operating model · illustrative values · not a quote or financial advice</text>
</svg>
